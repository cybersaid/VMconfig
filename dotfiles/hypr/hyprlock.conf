# Fond d'écran flouté
background {
    monitor =
    path = ~/.local/share/backgrounds/wallpaper-set.jpg
    blur_passes = 3
    blur_size = 400
    vibration = 0
}

# Horloge centrale, style "orbital"
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H')"
    font_size = 120
    font_family = JetBrains Mono Nerd Font
    color = rgba(ffffffe6)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%M')"
    font_size = 60
    font_family = JetBrains Mono Nerd Font
    color = rgba(ffffff99)
    position = 0, -10
    halign = center
    valign = center
}

label {
    monitor =
    text = $LONGDAY, $LONGDATE
    font_size = 16
    color = rgba(ffffff88)
    position = 0, -80
    halign = center
    valign = center
}

# Champ de saisie du mot de passe
input-field {
    monitor =
    size = 300, 50
    position = 0, -160
    halign = center
    valign = center
    dots_center = true
    placeholder_text = Mot de passe...
    fail_text = Incorrect
}

# Bouton de déverrouillage indication
label {
    monitor =
    text = Enter pour déverrouiller
    font_size = 12
    color = rgba(ffffff55)
    position = 0, -240
    halign = center
    valign = center
}
